name: Validate Homey app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run calculation tests
        run: npm test
      - name: Install Homey CLI
        run: npm install --global homey
      - name: Validate App Store package
        run: homey app validate --level publish
